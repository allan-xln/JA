services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      ELETROFRIO_START_INTERNAL_SCHEDULER: "false"
      WHATSAPP_SERVICE_URL: http://whatsapp:8091
      ELETROFRIO_API_URL: http://api:8000
      APP_PUBLIC_URL: http://localhost:3000
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/eletrofrio/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - api-logs:/app/logs
      - api-data:/app/data
    networks:
      - eletrofrio-net
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      ELETROFRIO_START_INTERNAL_SCHEDULER: "false"
      WHATSAPP_SERVICE_URL: http://whatsapp:8091
      ELETROFRIO_API_URL: http://api:8000
      APP_PUBLIC_URL: http://localhost:3000
    command: ["python", "-m", "api.scheduler"]
    depends_on:
      api:
        condition: service_started
      whatsapp:
        condition: service_started
    volumes:
      - api-logs:/app/logs
      - api-data:/app/data
    networks:
      - eletrofrio-net
    restart: unless-stopped

  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    env_file:
      - .env
    environment:
      WHATSAPP_PORT: "8091"
      WHATSAPP_SESSION_DIR: /app/sessions/eletrofrio
      ELETROFRIO_API_URL: http://api:8000
    ports:
      - "${WHATSAPP_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - whatsapp-sessions:/app/sessions
    networks:
      - eletrofrio-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        SERVER_API_URL: http://api:8000
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      SERVER_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - eletrofrio-net
    restart: unless-stopped

networks:
  eletrofrio-net:
    driver: bridge

volumes:
  whatsapp-sessions:
  api-logs:
  api-data:
